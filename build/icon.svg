<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2f45"/>
      <stop offset="1" stop-color="#15171d"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f7f4"/>
      <stop offset="1" stop-color="#e3e5ea"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9ab8ff"/>
      <stop offset="1" stop-color="#bb9af7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <!-- macOS-style rounded square with inset margin -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="185" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="3"/>
  <!-- page -->
  <g filter="url(#shadow)">
    <path d="M300 250 h300 l124 124 v400 a40 40 0 0 1 -40 40 h-384 a40 40 0 0 1 -40 -40 v-484 a40 40 0 0 1 40 -40 z" fill="url(#page)"/>
    <path d="M600 250 v84 a40 40 0 0 0 40 40 h84 z" fill="#c9ccd5"/>
  </g>
  <!-- markdown heading mark + lines -->
  <text x="330" y="420" font-family="SF Mono, Menlo, monospace" font-size="96" font-weight="700" fill="#7aa2f7">#</text>
  <rect x="400" y="352" width="170" height="30" rx="15" fill="#3b4261"/>
  <rect x="330" y="470" width="300" height="24" rx="12" fill="#9aa0ae"/>
  <rect x="330" y="530" width="340" height="24" rx="12" fill="#9aa0ae"/>
  <rect x="330" y="590" width="230" height="24" rx="12" fill="#9aa0ae"/>
  <rect x="330" y="650" width="280" height="24" rx="12" fill="#b8bdc8"/>
  <!-- agent sparkle -->
  <g filter="url(#shadow)">
    <path d="M735 560 C748 650 770 672 860 685 C770 698 748 720 735 810 C722 720 700 698 610 685 C700 672 722 650 735 560 Z" fill="url(#spark)"/>
  </g>
</svg>
