<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Software Update</title>
  <style>
    :root { color-scheme: dark light; --bg: #21242b; --fg: #d7dae0; --dim: #8b919e; --border: #30343d; --accent: #7aa2f7; --card: #1b1d23; --bad: #f7768e; --good: #9ece6a; }
    @media (prefers-color-scheme: light) { :root { --bg: #f3f3f1; --fg: #24262b; --dim: #676b74; --border: #dcdcd8; --accent: #3565d4; --card: #fff; --bad: #c4314b; --good: #3f7d20; } }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 18px 20px 70px; background: var(--bg); color: var(--fg); font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; user-select: none; }
    h1 { font-size: 15px; margin: 0 0 2px; }
    p.sub { color: var(--dim); margin: 0 0 14px; }
    .card { padding: 10px 12px; margin-bottom: 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--card); }
    label.opt { display: grid; grid-template-columns: 20px 1fr; gap: 2px 6px; cursor: pointer; }
    label.opt .d { grid-column: 2; color: var(--dim); font-size: 12px; }
    input[type=checkbox] { accent-color: var(--accent); margin: 3px 0 0; }
    #status { display: flex; align-items: center; gap: 10px; min-height: 30px; }
    #status .msg { flex: 1; }
    #status .msg small { display: block; color: var(--dim); font-size: 12px; }
    #status.error .msg { color: var(--bad); }
    #status.ready .msg, #status.up-to-date .msg { color: var(--good); }
    #notice { color: var(--bad); }
    .foot { position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: flex-end; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--border); background: var(--bg); }
    button { padding: 5px 14px; border-radius: 6px; border: 1px solid var(--border); background: var(--card); color: var(--fg); font: inherit; white-space: nowrap; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button:disabled { opacity: .55; }
  </style>
</head>
<body>
  <h1>Software Update</h1>
  <p class="sub" id="version"></p>
  <div class="card" id="notice" hidden></div>
  <div class="card"><div id="status"><div class="msg"></div><button type="button" id="action" hidden></button></div></div>
  <div class="card">
    <label class="opt">
      <input type="checkbox" id="auto">
      <span>Check for updates automatically</span>
      <span class="d">Once a day Margin asks github.com/kpiljoong/margin whether a newer version exists. Nothing about your notes is sent. Updates are installed only when you click Install.</span>
    </label>
  </div>
  <div class="foot"><button type="button" id="close">Close</button></div>
  <script src="update-dialog.js"></script>
</body>
</html>
